<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Semantic embedding space</title>
  <desc id="desc">A query vector sits near related document vectors in a two-dimensional conceptual embedding space.</desc>
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#e6ebf2" stroke-width="1"/></pattern>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#31527c" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1000" height="520" rx="22" fill="#f8fafc"/><rect x="60" y="45" width="880" height="400" rx="16" fill="url(#grid)" stroke="#e2e8f0"/>
  <g fill="#cbd5e1" opacity=".85"><circle cx="145" cy="125" r="7"/><circle cx="220" cy="310" r="7"/><circle cx="330" cy="110" r="7"/><circle cx="405" cy="365" r="7"/><circle cx="530" cy="95" r="7"/><circle cx="615" cy="350" r="7"/><circle cx="820" cy="120" r="7"/><circle cx="865" cy="320" r="7"/></g>
  <ellipse cx="410" cy="235" rx="185" ry="125" fill="#dbeafe" opacity=".55" stroke="#7aa8df" stroke-dasharray="7 7" stroke-width="2"/>
  <g fill="#4f8fd8" filter="url(#shadow)"><circle cx="310" cy="185" r="11"/><circle cx="360" cy="275" r="11"/><circle cx="420" cy="160" r="11"/><circle cx="475" cy="235" r="11"/><circle cx="390" cy="320" r="11"/><circle cx="505" cy="300" r="11"/></g>
  <g fill="#9b8be7" filter="url(#shadow)"><circle cx="700" cy="160" r="10"/><circle cx="760" cy="230" r="10"/><circle cx="680" cy="300" r="10"/><circle cx="820" cy="260" r="10"/></g>
  <g filter="url(#shadow)"><circle cx="420" cy="235" r="20" fill="#f59e0b" stroke="#fff" stroke-width="5"/></g>
  <path d="M420 215V135H545" fill="none" stroke="#b7791f" stroke-width="2"/><rect x="540" y="105" width="190" height="54" rx="10" fill="#fff" stroke="#f1d29a"/><text x="635" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e">Query vector</text><text x="635" y="144" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#a16207">semantic meaning</text>
  <g font-family="Arial,sans-serif" font-size="14" fill="#334155"><text x="95" y="485">Conceptual 2D view — real embeddings usually have hundreds or thousands of dimensions.</text></g>
  <g font-family="Arial,sans-serif" font-size="13"><circle cx="740" cy="480" r="6" fill="#4f8fd8"/><text x="754" y="484" fill="#475569">Related documents</text><circle cx="880" cy="480" r="6" fill="#9b8be7"/><text x="894" y="484" fill="#475569">Other topics</text></g>
</svg>
