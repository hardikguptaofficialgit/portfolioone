    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#263b58" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6" fill="none" stroke="#70839b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f7f8fb"/>
