<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">A retrieval augmented generation pipeline</title>
  <desc id="desc">Documents are chunked, embedded, stored, retrieved and passed to a language model to produce a grounded answer.</desc>
